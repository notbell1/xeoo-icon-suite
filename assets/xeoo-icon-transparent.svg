<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Luxurious Gradient 1: Crimson Red to Coral -->
    <linearGradient id="gradCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Luxurious Gradient 2: Cyber Violet to Electric Pink -->
    <linearGradient id="gradViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Core Diamond Gradient -->
    <linearGradient id="gradCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter (Optimized for dark & light) -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- NO RECT / NO BACKGROUND FILL — 100% TRANSPARENT CANVAS -->

  <!-- Left-to-Right Diagonal Bar with Facets -->
  <path d="M 46 36 L 86 36 L 210 220 L 170 220 Z" fill="url(#gradCrimson)" filter="url(#softGlow)" rx="6" />
  
  <!-- Right-to-Left Diagonal Bar with Facets -->
  <path d="M 210 36 L 170 36 L 46 220 L 86 220 Z" fill="url(#gradViolet)" opacity="0.95" rx="6" />

  <!-- Center Floating Diamond Core -->
  <polygon points="128,102 154,128 128,154 102,128" fill="url(#gradCore)" opacity="0.95" filter="url(#softGlow)" />

  <!-- Floating Dynamic Accent Orbs -->
  <circle cx="48" cy="222" r="7" fill="#38bdf8" />
  <circle cx="208" cy="34" r="7" fill="#f43f5e" />
</svg>


  <!-- Primitive 1: 45° Chamfer Fold -->
  <rect x="45" y="240" width="125" height="75" rx="4" fill="#181A26" stroke="#2A2D3D" stroke-width="1"/>
  <g transform="translate(60, 252)">
    <path d="M 0 0 L 28 0 L 40 12 L 40 40 L 0 40 Z" fill="#1E202E" stroke="#C5CEDB" stroke-width="2"/>
    <path d="M 28 0 L 28 12 L 40 12 Z" fill="#12131C" stroke="#C5CEDB" stroke-width="2"/>
  </g>
  <text x="115" y="275" class="caption" font-weight="600">45° Chamfer</text>
  <text x="115" y="290" class="caption">Cutaway Fold</text>

  <!-- Primitive 2: Diamond Telemetry Node -->
  <rect x="185" y="240" width="125" height="75" rx="4" fill="#181A26" stroke="#2A2D3D" stroke-width="1"/>
  <g transform="translate(205, 260)">
    <polygon points="18,5 31,18 18,31 5,18" fill="#4DEBFF"/>
    <circle cx="18" cy="18" r="3" fill="#12131C"/>

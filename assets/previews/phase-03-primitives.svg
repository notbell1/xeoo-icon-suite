<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 18px; font-weight: 700; fill: #C5CEDB; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; fill: #A78BFA; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: 600; fill: #4DEBFF; letter-spacing: 1px; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; fill: #8F9CAE; }
      .hex-code { font-family: monospace; font-size: 10px; fill: #C5CEDB; }
      .spec-bg { fill: #0D0E15; }
      .card-dark { fill: #1E1E1E; stroke: #2D3139; stroke-width: 1; }
      .card-deep { fill: #0A0A0F; stroke: #232530; stroke-width: 1; }
      .card-light { fill: #F5F5F5; stroke: #D8DCE3; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="520" class="spec-bg"/>
  <rect x="20" y="20" width="760" height="480" rx="8" fill="#12131C" stroke="#232538" stroke-width="1.5"/>

  <!-- Header -->
  <text x="45" y="55" class="title">XEOO ICON THEME — DESIGN SYSTEM SPECIMEN SHEET</text>
  <text x="45" y="75" class="subtitle">Phase 03: Geometric Primitives, Color Tokens &amp; Base Carrier Verification</text>
  <line x1="45" y1="90" x2="755" y2="90" stroke="#232538" stroke-width="1.5"/>

  <!-- Section 1: Color Tokens -->
  <text x="45" y="118" class="section-label">01. DESIGN TOKENS (CONTROLLED PALETTE)</text>
  
  <!-- Swatches -->
  <!-- Neon Cyan -->
  <rect x="45" y="132" width="75" height="30" rx="4" fill="#4DEBFF"/>
  <text x="45" y="176" class="caption">Neon Cyan</text>
  <text x="45" y="190" class="hex-code">#4DEBFF</text>

  <!-- Primary Violet -->
  <rect x="135" y="132" width="75" height="30" rx="4" fill="#A78BFA"/>
  <text x="135" y="176" class="caption">Prim. Violet</text>
  <text x="135" y="190" class="hex-code">#A78BFA</text>

  <!-- Cyber Mint -->
  <rect x="225" y="132" width="75" height="30" rx="4" fill="#63F5B2"/>
  <text x="225" y="176" class="caption">Cyber Mint</text>
  <text x="225" y="190" class="hex-code">#63F5B2</text>

  <!-- Plasma Pink -->
  <rect x="315" y="132" width="75" height="30" rx="4" fill="#FF65C3"/>
  <text x="315" y="176" class="caption">Plasma Pink</text>
  <text x="315" y="190" class="hex-code">#FF65C3</text>

  <!-- Solar Amber -->
  <rect x="405" y="132" width="75" height="30" rx="4" fill="#FFC66D"/>
  <text x="405" y="176" class="caption">Solar Amber</text>
  <text x="405" y="190" class="hex-code">#FFC66D</text>

  <!-- Titanium -->
  <rect x="495" y="132" width="75" height="30" rx="4" fill="#C5CEDB"/>
  <text x="495" y="176" class="caption">Titanium</text>
  <text x="495" y="190" class="hex-code">#C5CEDB</text>


  <line x1="15" y1="23.5" x2="17" y2="23.5" stroke="#4DEBFF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="23.5" x2="24" y2="23.5" stroke="#4DEBFF" stroke-width="1.5" stroke-linecap="round"/>
</svg>


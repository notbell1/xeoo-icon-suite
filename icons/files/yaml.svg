<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Chamfered Data Plate Body -->
  <path d="M 4 3 L 21 3 L 28 10 L 28 29 L 4 29 Z" fill="#1E202E" stroke="#63F5B2" stroke-width="2" stroke-linejoin="round"/>
  <!-- Corner Chamfer Facet -->
  <path d="M 21 3 L 21 10 L 28 10 Z" fill="#12131C" stroke="#63F5B2" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bold 'Y' Branching Tree Structure -->
  <line x1="9" y1="12" x2="16" y2="18" stroke="#63F5B2" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="23" y1="12" x2="16" y2="18" stroke="#63F5B2" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="18" x2="16" y2="25" stroke="#63F5B2" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Branch Terminal Nodes -->
  <circle cx="9" cy="12" r="1.75" fill="#4DEBFF"/>
  <circle cx="23" cy="12" r="1.75" fill="#4DEBFF"/>
  <circle cx="16" cy="25" r="1.75" fill="#FFC66D"/>
  <!-- Central Divergence Node -->
  <polygon points="16,16 18,18 16,20 14,18" fill="#FF65C3"/>
</svg>

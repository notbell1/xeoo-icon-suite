  <!-- Isometric Axis Spokes -->
  <line x1="16" y1="16" x2="16" y2="29" stroke="#C5CEDB" stroke-width="1.75"/>
  <line x1="16" y1="16" x2="5" y2="9.5" stroke="#C5CEDB" stroke-width="1.75"/>
  <line x1="16" y1="16" x2="27" y2="9.5" stroke="#C5CEDB" stroke-width="1.75"/>
  <!-- Locking Vertex Arrow Clamps -->

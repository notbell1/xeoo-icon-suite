<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Precision Vector Artboard Substrate -->
  <path d="M 5 4 L 27 4 L 27 28 L 5 28 Z" fill="#1E202E" stroke="#FF65C3" stroke-width="2" stroke-linejoin="round"/>
  <!-- Tangent Control Handle Rails -->
  <line x1="8" y1="23" x2="16" y2="23" stroke="#4DEBFF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="9" x2="24" y2="9" stroke="#4DEBFF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Dynamic Bezier Spline Curve -->
  <path d="M 8 23 C 16 23, 16 9, 24 9" fill="none" stroke="#FF65C3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Vector Anchor Points (Diamond Nodes) -->
  <polygon points="8,21 10,23 8,25 6,23" fill="#63F5B2"/>
  <polygon points="24,7 26,9 24,11 22,9" fill="#63F5B2"/>
  <!-- Handle Endpoint Sensors -->
  <circle cx="16" cy="23" r="1.25" fill="#4DEBFF"/>
  <circle cx="16" cy="9" r="1.25" fill="#4DEBFF"/>
  <!-- Center Inflection Point -->
  <circle cx="16" cy="16" r="1.5" fill="#FFC66D"/>
</svg>


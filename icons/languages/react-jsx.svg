<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Central Nuclear Core -->
  <circle cx="16" cy="16" r="2.5" fill="#4DEBFF"/>
  <!-- Orbital Ring 1 (Horizontal) -->
  <ellipse cx="16" cy="16" rx="12" ry="4.5" fill="none" stroke="#4DEBFF" stroke-width="2"/>
  <!-- Orbital Ring 2 (60deg Rotation) -->
  <ellipse cx="16" cy="16" rx="12" ry="4.5" transform="rotate(60 16 16)" fill="none" stroke="#4DEBFF" stroke-width="2"/>
  <!-- Orbital Ring 3 (120deg Rotation) -->
  <ellipse cx="16" cy="16" rx="12" ry="4.5" transform="rotate(120 16 16)" fill="none" stroke="#4DEBFF" stroke-width="2"/>
</svg>


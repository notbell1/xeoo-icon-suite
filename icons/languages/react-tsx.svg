<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Central Nuclear Core -->
  <circle cx="16" cy="16" r="2.5" fill="#4DEBFF"/>
  <!-- Orbital Ring 1 (Horizontal - Neon Cyan) -->
  <ellipse cx="16" cy="16" rx="12" ry="4.5" fill="none" stroke="#4DEBFF" stroke-width="2"/>
  <!-- Orbital Ring 2 (60deg Rotation - Primary Violet) -->
  <ellipse cx="16" cy="16" rx="12" ry="4.5" transform="rotate(60 16 16)" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <!-- Orbital Ring 3 (120deg Rotation - Neon Cyan) -->
  <ellipse cx="16" cy="16" rx="12" ry="4.5" transform="rotate(120 16 16)" fill="none" stroke="#4DEBFF" stroke-width="2"/>
  <!-- Integrated TS Corner Indicator Badge -->
  <polygon points="22,4 28,4 28,10 22,10" fill="#12131C" stroke="#A78BFA" stroke-width="1.5"/>
  <line x1="23.5" y1="5.5" x2="26.5" y2="5.5" stroke="#A78BFA" stroke-width="1.25"/>
  <line x1="25" y1="5.5" x2="25" y2="8.5" stroke="#A78BFA" stroke-width="1.25"/>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Supersonic Upper Acceleration Rail -->
  <line x1="3" y1="9" x2="25" y2="9" stroke="#4DEBFF" stroke-width="2" stroke-linecap="round"/>
  <!-- Trailing Speed Line -->
  <line x1="26" y1="13" x2="30" y2="13" stroke="#4DEBFF" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Sensor Visor - Left Lens -->
  <circle cx="11" cy="16" r="4.5" fill="#1E202E" stroke="#4DEBFF" stroke-width="2"/>
  <circle cx="11" cy="16" r="1.75" fill="#63F5B2"/>
  <!-- Sensor Visor - Right Lens -->
  <circle cx="21" cy="16" r="4.5" fill="#1E202E" stroke="#4DEBFF" stroke-width="2"/>
  <circle cx="21" cy="16" r="1.75" fill="#63F5B2"/>
  <!-- Inter-Lens Telemetry Bridge -->
  <line x1="15.5" y1="16" x2="16.5" y2="16" stroke="#4DEBFF" stroke-width="2"/>
  <!-- Lower Propulsion Rail -->
  <line x1="6" y1="23" x2="28" y2="23" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
</svg>

